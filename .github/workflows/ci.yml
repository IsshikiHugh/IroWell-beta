name: CI

# Every suite in test/suites: no model calls, no Claude login. It starts the real daemon and client and drives
# the page with Chromium; Claude is the stand-in in test/fakeclaude. The suites in test/real talk to Claude for
# real, so they stay a local run (node test/run.mjs real).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    # (the suites in four shards, one per runner; one that fails lets the others finish)
    name: suites-${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            test/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm ci --prefix test
      - run: npx --prefix test playwright-core install --with-deps chromium-headless-shell
      - run: node test/run.mjs --shard ${{ matrix.part }}/4
      - name: Logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.part }}-${{ github.run_attempt }}
          path: /tmp/iro-test-*
